name: ai_chat_app
description: "A new Flutter project."
publish_to: 'none' # Prevent accidental publishing

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts:
  provider: ^6.1.5+1
  font_awesome_flutter: ^10.12.0
  another_flushbar: ^1.12.32
  get_x: ^5.0.0
  cloud_firestore: 
  flutter_spinkit: ^5.2.2
  go_router: ^17.1.0
  firebase_storage: ^13.0.6
  shared_preferences: ^2.5.4
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_pagination: ^4.2.0

  uuid: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  # Option 1: Enable custom fonts
  fonts:
    - family: Bauhaus
      fonts:
        - asset: assets/fonts/bauhaus.ttf
  # Optionally add more fonts here:
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
